<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Gradient Canvas -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="105%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Large Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Stylized Interactive Grid Line (Resize references) -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12,12" opacity="0.6" />

  <!-- Outer Border Corner Resize Handles -->
  <circle cx="64" cy="64" r="8" fill="#818cf8" />
  <circle cx="448" cy="64" r="8" fill="#818cf8" />
  <circle cx="64" cy="448" r="8" fill="#818cf8" />
  <circle cx="448" cy="448" r="8" fill="#818cf8" />

  <!-- Center Artwork (Two overlapping sheets representing photo and PDF resizing) -->
  <g transform="translate(112, 112)">
    <!-- Photo Back Sheet -->
    <rect x="18" y="54" width="220" height="170" rx="24" fill="none" stroke="url(#primaryGrad)" stroke-width="12" />
    <path d="M 36,190 L 100,126 L 146,172 L 180,138 L 220,178" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="85" cy="110" r="16" fill="url(#primaryGrad)" />

    <!-- PDF Front Sheet -->
    <rect x="70" y="24" width="200" height="250" rx="28" fill="#0f172a" stroke="url(#secondaryGrad)" stroke-width="14" />
    <!-- Horizontal lines inside PDF sheet representing content -->
    <line x1="110" y1="90" x2="230" y2="90" stroke="#34d399" stroke-width="10" stroke-linecap="round" opacity="0.8" />
    <line x1="110" y1="140" x2="210" y2="140" stroke="#34d399" stroke-width="10" stroke-linecap="round" opacity="0.8" />
    <line x1="110" y1="190" x2="180" y2="190" stroke="#34d399" stroke-width="10" stroke-linecap="round" opacity="0.8" />

    <!-- Action Scale Arrows -->
    <g transform="translate(230,210)">
      <circle cx="10" cy="10" r="32" fill="#34d399" />
      <path d="M -2,-2 L 16,-2 M 16,-2 L 16,16 M 16,-2 L -4,18" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
